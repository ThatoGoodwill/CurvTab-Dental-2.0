name: Client Billing Validation
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/client-billing-validation.yml'
  push:
    branches:
      - feature/client-billing-separate-day-signoffs-20261110
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript and Vite build
        working-directory: frontend
        run: npm run build
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API and persistence (no database access)
        run: dotnet build backend/CurvTabDental.API/CurvTabDental.API.csproj --configuration Release
